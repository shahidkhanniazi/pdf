name: Build Android APK

# Builds the Something Historic app and attaches the APK to a GitHub Release,
# so it can be downloaded straight to a phone. Runs on every push that changes
# the app, and can also be started by hand from the Actions tab.
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/something-historic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: something-historic-apk
          path: app/build/something-historic.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: Something Historic app (build ${{ github.run_number }})
          body: |
            Android app built from ${{ github.sha }}.
            Download **something-historic.apk** below and open it on your phone to install.
            Ads use Google's test ids until real AdMob ids are added in app/lib/config.dart.
          files: app/build/something-historic.apk
          make_latest: true
